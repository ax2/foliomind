name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run audit:security
      - run: npm test
      - run: npm run review:architecture
      - run: npm run build
      - run: npm run test:sites
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  desktop:
    # A version-bump push is built once by release.yml, which also owns the
    # published installers. Keep desktop regression for ordinary main pushes
    # because release.yml safely skips already-published same-version commits.
    if: "${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(release): bump FolioMind to ') }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            installer_kind: nsis
            installer_dir: nsis
            artifact: FolioMind-Windows-NSIS
            paths: |
              src-tauri/target/release/bundle/nsis/*
          - os: windows-latest
            args: --bundles msi
            installer_kind: msi
            installer_dir: msi
            artifact: FolioMind-Windows-MSI
            paths: |
              src-tauri/target/release/bundle/msi/*
          - os: macos-14
            args: --bundles app,dmg
            installer_kind: macos-dmg
            installer_dir: dmg
            artifact: FolioMind-macOS
            paths: |
              src-tauri/target/release/bundle/macos/*
              src-tauri/target/release/bundle/dmg/*
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          components: clippy
      - run: npm ci
      - run: npm run fetch:pi
      - run: npm run fetch:bash
      - run: npm run smoke:pi
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- ${{ matrix.args }}
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extension = if ('${{ matrix.installer_kind }}' -eq 'nsis') { '*.exe' } else { '*.msi' }
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/${{ matrix.installer_dir }}' -Filter $extension -File | Select-Object -First 1
          if (-not $installer) { throw "No $extension installer found" }
          ./scripts/installer-smoke.ps1 -Kind '${{ matrix.installer_kind }}' -InstallerPath $installer.FullName
      - name: Smoke test macOS DMG
        if: runner.os == 'macOS'
        run: bash scripts/installer-smoke-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
      - name: Clean generated build output
        if: always()
        run: npm run clean
