name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run audit:security
      - run: npm test
      - run: npm run review:architecture
      - run: npm run build
      - run: npm run test:sites
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  desktop:
    # A version-bump push is built once by release.yml, which also owns the
    # published installers. Keep desktop regression for ordinary main pushes
    # because release.yml safely skips already-published same-version commits.
    if: "${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(release): bump FolioMind to ') }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            installer_kind: nsis
            installer_dir: nsis
            artifact: FolioMind-Windows-NSIS
            paths: |
              src-tauri/target/release/bundle/nsis/*
          - os: windows-latest
            args: --bundles msi
            installer_kind: msi
            installer_dir: msi
            artifact: FolioMind-Windows-MSI
            paths: |
              src-tauri/target/release/bundle/msi/*
          - os: macos-14
            args: --bundles app,dmg
            installer_kind: macos-dmg
            installer_dir: dmg
            artifact: FolioMind-macOS
            paths: |
              src-tauri/target/release/bundle/macos/*
              src-tauri/target/release/bundle/dmg/*
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          components: clippy
      - run: npm ci
      - run: npm run fetch:pi
      - run: npm run fetch:bash
      - run: npm run smoke:pi
      - name: Download previous release installer for upgrade smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'FolioMind-CI' }
          $currentText = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($currentText -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Invalid current version: $currentText" }
          $currentVersion = [version]::new([int]$Matches[0].Split('.')[0], [int]$Matches[0].Split('.')[1], [int]($Matches[0].Split('.')[2] -replace '[-+].*$', ''))
          $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/${{ github.repository }}/releases?per_page=100' -Headers $headers
          $previous = $releases | ForEach-Object {
            $tag = [string]$_.tag_name
            if ($tag -match '^v?(\d+)\.(\d+)\.(\d+)$' -and -not $_.draft -and -not $_.prerelease) {
              $version = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
              if ($version -lt $currentVersion) {
                [pscustomobject]@{ Version = $version; VersionText = $tag.TrimStart('v'); Release = $_ }
              }
            }
          } | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $previous) { throw "No published release older than $currentText was found" }
          $assetName = if ('${{ matrix.installer_kind }}' -eq 'nsis') {
            "FolioMind_$($previous.VersionText)_x64-setup.exe"
          } else {
            "FolioMind_$($previous.VersionText)_x64_en-US.msi"
          }
          $asset = @($previous.Release.assets) | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) { throw "Release $($previous.Release.tag_name) does not contain $assetName" }
          $destination = Join-Path $env:RUNNER_TEMP ("foliomind-previous-${{ matrix.installer_kind }}$([IO.Path]::GetExtension($assetName))")
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $destination
          if (-not (Test-Path -LiteralPath $destination -PathType Leaf) -or (Get-Item -LiteralPath $destination).Length -lt 100KB) {
            throw "Previous installer download is missing or unexpectedly small: $destination"
          }
          "FOLIOMIND_PREVIOUS_INSTALLER=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Run native keyring smoke
        if: runner.os == 'Windows' || runner.os == 'macOS'
        env:
          FOLIOMIND_KEYRING_SMOKE: "1"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml os_keyring_round_trips -- --ignored --exact
      - run: npm run desktop:build -- ${{ matrix.args }}
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extension = if ('${{ matrix.installer_kind }}' -eq 'nsis') { '*.exe' } else { '*.msi' }
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/${{ matrix.installer_dir }}' -Filter $extension |
            Where-Object { -not $_.PSIsContainer } | Select-Object -First 1
          if (-not $installer) { throw "No $extension installer found" }
          ./scripts/installer-smoke.ps1 -Kind '${{ matrix.installer_kind }}' -InstallerPath $installer.FullName
      - name: Smoke test Windows upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extension = if ('${{ matrix.installer_kind }}' -eq 'nsis') { '*.exe' } else { '*.msi' }
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/${{ matrix.installer_dir }}' -Filter $extension |
            Where-Object { -not $_.PSIsContainer } | Select-Object -First 1
          if (-not $installer) { throw "No $extension installer found" }
          ./scripts/installer-upgrade-smoke.ps1 -Kind '${{ matrix.installer_kind }}' -PreviousInstallerPath $env:FOLIOMIND_PREVIOUS_INSTALLER -CurrentInstallerPath $installer.FullName
      - name: Smoke test macOS DMG
        if: runner.os == 'macOS'
        run: bash scripts/installer-smoke-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
      - name: Clean generated build output
        if: always()
        run: npm run clean
