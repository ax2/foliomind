name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version matching package, Cargo, and Tauri config (for example 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Require the current main commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
            echo "Release workflow must run from the current main commit" >&2
            exit 1
          }
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease || 'false' }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          else
            version="$(node -p 'require("./package.json").version')"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid SemVer: $version" >&2; exit 1; }
          VERSION="$version" node -e 'const fs=require("fs"); const v=process.env.VERSION; const values=[require("./package.json").version,require("./package-lock.json").version,require("./src-tauri/tauri.conf.json").version]; const cargo=fs.readFileSync("src-tauri/Cargo.toml","utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1]; values.push(cargo); if(values.some(x=>x!==v)) throw new Error(`Version mismatch: expected ${v}, found ${values.join(", ")}`)'
          prerelease=false
          if [ "$REQUESTED_PRERELEASE" = "true" ]; then prerelease=true; fi
          should_release=true
          release_json=''
          if release_json="$(gh release view "v$version" --repo "$REPOSITORY" --json isDraft,isPrerelease 2>/dev/null)"; then
            if [ "$(jq -r .isDraft <<<"$release_json")" = "false" ]; then
              # A published tag already represents this package version. A
              # later same-version commit must not rebuild or overwrite it.
              should_release=false
            else
              expected_prerelease=false
              if [ "$prerelease" = "true" ]; then expected_prerelease=true; fi
              test "$(jq -r .isPrerelease <<<"$release_json")" = "$expected_prerelease" || { echo "Draft release v$version has a different prerelease setting" >&2; exit 1; }
            fi
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

  web-qa:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install frontend and browser QA dependencies
        run: |
          set -euo pipefail
          npm ci
          python3 -m venv "$RUNNER_TEMP/foliomind-qa-venv"
          "$RUNNER_TEMP/foliomind-qa-venv/bin/pip" install --upgrade pip playwright
          "$RUNNER_TEMP/foliomind-qa-venv/bin/python" -m playwright install --with-deps chromium
      - run: npm run build
      - name: Start standalone Web Host
        env:
          FOLIOMIND_DEV_DATA_DIR: ${{ runner.temp }}/foliomind-qa-data
          FOLIOMIND_WEB_PORT: "5173"
          FOLIOMIND_HOST_PORT: "43123"
        run: |
          set -euo pipefail
          npm run web:dev > "$RUNNER_TEMP/foliomind-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/foliomind-web.pid"
          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            sed -n '1,240p' "$RUNNER_TEMP/foliomind-web.log"
            exit 1
          fi
      - name: Run repeatable real-data boundary QA
        env:
          FOLIOMIND_QA_URL: http://127.0.0.1:5173
          FOLIOMIND_QA_DATA_DIR: ${{ runner.temp }}/foliomind-qa-data
        run: |
          set -euo pipefail
          export FOLIOMIND_CHROMIUM="$($RUNNER_TEMP/foliomind-qa-venv/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          FOLIOMIND_DEV_DATA_DIR="$FOLIOMIND_QA_DATA_DIR" "$RUNNER_TEMP/foliomind-qa-venv/bin/python" scripts/qa-playwright.py
      - name: Upload Web QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FolioMind-Web-QA
          path: |
            .qa/
            ${{ runner.temp }}/foliomind-web.log
          if-no-files-found: warn
      - name: Stop standalone Web Host
        if: always()
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/foliomind-web.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/foliomind-web.pid")" 2>/dev/null || true
          fi

  build:
    needs: [prepare, web-qa]
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: FolioMind-Windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-14
            bundles: dmg
            artifact: FolioMind-macOS-Apple-Silicon
            paths: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          components: clippy,rustfmt
      - run: npm ci
      - name: Run security audit with transient retry
        shell: bash
        run: |
          audit_log="$(mktemp)"
          for attempt in 1 2 3; do
            : > "$audit_log"
            set +e
            npm run audit:security 2>&1 | tee "$audit_log"
            audit_status=${PIPESTATUS[0]}
            set -e
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eiq '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|ENETUNREACH' "$audit_log"; then
              exit "$audit_status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm registry audit failed; retrying ($((attempt + 1))/3)"
              sleep 15
            fi
          done
          echo "::warning::npm audit service was temporarily unavailable after three attempts; local tests and build gates remain mandatory"
      - run: npm test
      - run: npm run build
      - run: npm run test:sites
      - run: npm run fetch:pi
      - run: npm run fetch:bash
      - run: npm run smoke:pi
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or reuse draft release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          release_json=''
          if release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease 2>/dev/null)"; then
            test "$(jq -r .isDraft <<<"$release_json")" = "true" || { echo "Release $TAG is already published" >&2; exit 1; }
            expected_prerelease=false
            if [ "$PRERELEASE" = "true" ]; then expected_prerelease=true; fi
            test "$(jq -r .isPrerelease <<<"$release_json")" = "$expected_prerelease" || { echo "Draft release $TAG has a different prerelease setting" >&2; exit 1; }
          fi
          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || { echo "Tag $TAG points to a different commit" >&2; exit 1; }
            tag_exists=true
          fi
          if [ -n "$release_json" ] && [ "$tag_exists" != true ]; then
            echo "Existing release $TAG has no matching tag" >&2
            exit 1
          fi
          cd release-assets
          mapfile -d '' windows_exe < <(find . -type f -name '*.exe' -print0 | sort -z)
          mapfile -d '' windows_msi < <(find . -type f -name '*.msi' -print0 | sort -z)
          mapfile -d '' macos_dmg < <(find . -type f -name '*.dmg' -print0 | sort -z)
          test "${#windows_exe[@]}" -eq 1 || { echo "Expected exactly one Windows NSIS installer" >&2; exit 1; }
          test "${#windows_msi[@]}" -eq 1 || { echo "Expected exactly one Windows MSI installer" >&2; exit 1; }
          test "${#macos_dmg[@]}" -eq 1 || { echo "Expected exactly one macOS DMG installer" >&2; exit 1; }
          mkdir selected
          for source in "${windows_exe[@]}" "${windows_msi[@]}" "${macos_dmg[@]}"; do
            target="selected/$(basename "$source")"
            test ! -e "$target" || { echo "Installer filename collision: $target" >&2; exit 1; }
            cp -- "$source" "$target"
          done
          cd selected
          mapfile -t files < <(find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -printf '%f\n' | sort)
          test "${#files[@]}" -eq 3
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if [ -z "$release_json" ]; then
            args=("$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes --title "FolioMind $TAG")
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          fi
          files+=(SHA256SUMS.txt)
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          publish_args=(--draft=false)
          if [ "$PRERELEASE" != "true" ]; then publish_args+=(--latest); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${publish_args[@]}"
      - name: Verify published Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            | node scripts/verify-release-assets.mjs "$VERSION"
