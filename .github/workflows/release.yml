name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version matching package, Cargo, and Tauri config (for example 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid SemVer: $VERSION" >&2; exit 1; }
          node -e 'const fs=require("fs"); const v=process.env.VERSION; const values=[require("./package.json").version,require("./package-lock.json").version,require("./src-tauri/tauri.conf.json").version]; const cargo=fs.readFileSync("src-tauri/Cargo.toml","utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1]; values.push(cargo); if(values.some(x=>x!==v)) throw new Error(`Version mismatch: expected ${v}, found ${values.join(", ")}`)'
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create or reuse draft release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/tmp/release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/release.json)" = "true" || { echo "Release $TAG is already published" >&2; exit 1; }
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || { echo "Draft release $TAG points to a different commit" >&2; exit 1; }
          else
            args=("$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes --title "FolioMind $TAG")
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: FolioMind-Windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-14
            bundles: dmg
            artifact: FolioMind-macOS-Apple-Silicon
            paths: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run fetch:pi
      - run: npm run fetch:bash
      - run: npm run smoke:pi
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload installers and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          files=(*)
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
