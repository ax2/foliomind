name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version matching package, Cargo, and Tauri config (for example 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Require the current main commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
            echo "Release workflow must run from the current main commit" >&2
            exit 1
          }
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid SemVer: $VERSION" >&2; exit 1; }
          node -e 'const fs=require("fs"); const v=process.env.VERSION; const values=[require("./package.json").version,require("./package-lock.json").version,require("./src-tauri/tauri.conf.json").version]; const cargo=fs.readFileSync("src-tauri/Cargo.toml","utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1]; values.push(cargo); if(values.some(x=>x!==v)) throw new Error(`Version mismatch: expected ${v}, found ${values.join(", ")}`)'
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: FolioMind-Windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-14
            bundles: dmg
            artifact: FolioMind-macOS-Apple-Silicon
            paths: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          components: clippy,rustfmt
      - run: npm ci
      - run: npm run audit:security
      - run: npm test
      - run: npm run build
      - run: npm run test:sites
      - run: npm run fetch:pi
      - run: npm run fetch:bash
      - run: npm run smoke:pi
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or reuse draft release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          release_json=''
          if release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease 2>/dev/null)"; then
            test "$(jq -r .isDraft <<<"$release_json")" = "true" || { echo "Release $TAG is already published" >&2; exit 1; }
            expected_prerelease=false
            if [ "$PRERELEASE" = "true" ]; then expected_prerelease=true; fi
            test "$(jq -r .isPrerelease <<<"$release_json")" = "$expected_prerelease" || { echo "Draft release $TAG has a different prerelease setting" >&2; exit 1; }
          fi
          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || { echo "Tag $TAG points to a different commit" >&2; exit 1; }
            tag_exists=true
          fi
          if [ -n "$release_json" ] && [ "$tag_exists" != true ]; then
            echo "Existing release $TAG has no matching tag" >&2
            exit 1
          fi
          cd release-assets
          mapfile -d '' windows_exe < <(find . -type f -name '*.exe' -print0 | sort -z)
          mapfile -d '' windows_msi < <(find . -type f -name '*.msi' -print0 | sort -z)
          mapfile -d '' macos_dmg < <(find . -type f -name '*.dmg' -print0 | sort -z)
          test "${#windows_exe[@]}" -eq 1 || { echo "Expected exactly one Windows NSIS installer" >&2; exit 1; }
          test "${#windows_msi[@]}" -eq 1 || { echo "Expected exactly one Windows MSI installer" >&2; exit 1; }
          test "${#macos_dmg[@]}" -eq 1 || { echo "Expected exactly one macOS DMG installer" >&2; exit 1; }
          mkdir selected
          for source in "${windows_exe[@]}" "${windows_msi[@]}" "${macos_dmg[@]}"; do
            target="selected/$(basename "$source")"
            test ! -e "$target" || { echo "Installer filename collision: $target" >&2; exit 1; }
            cp -- "$source" "$target"
          done
          cd selected
          mapfile -t files < <(find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -printf '%f\n' | sort)
          test "${#files[@]}" -eq 3
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if [ -z "$release_json" ]; then
            args=("$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes --title "FolioMind $TAG")
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          fi
          files+=(SHA256SUMS.txt)
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          publish_args=(--draft=false)
          if [ "$PRERELEASE" != "true" ]; then publish_args+=(--latest); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${publish_args[@]}"
